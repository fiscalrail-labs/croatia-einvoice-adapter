services:
  - type: web
    name: croatia-einvoice-adapter
    runtime: docker
    plan: starter
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: ALLOW_UNAUTHENTICATED
        value: "false"
      - key: ALLOW_LEGACY_FALLBACK
        value: "false"
      - key: ENABLE_OFFICIAL_ENGINE
        value: "true"
      - key: API_KEY
        generateValue: true
      - key: MAX_REQUEST_BYTES
        value: "2097152"
      - key: RAPIDAPI_PROXY_SECRET
        sync: false
